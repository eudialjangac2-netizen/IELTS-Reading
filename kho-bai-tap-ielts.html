<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kho Bài Tập - IELTS Reading</title>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Google Sans', 'Product Sans', Roboto, sans-serif;
    background: #ffffff;
    color: #2d2a24;
    min-height: 100vh;
  }

  /* ---------- Banner cover 4 Nàng Tiên (full-bleed, mờ dần xuống trắng) ---------- */
  .banner-cover { position: relative; width: 100%; height: 340px; overflow: hidden; }
  .banner-cover img {
    width: 100%; height: 100%; object-fit: cover; object-position: center 35%; display: block;
  }
  .banner-overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; padding: 0 20px;
    background: linear-gradient(180deg, rgba(20,15,10,0.18) 0%, rgba(20,15,10,0.04) 45%, #ffffff 100%);
  }
  .banner-overlay h1 {
    font-size: 27px; font-weight: 700; color: #fff; margin-bottom: 8px;
    text-shadow: 0 2px 12px rgba(0,0,0,0.4);
  }
  .banner-overlay p { font-size: 14px; color: #fff; text-shadow: 0 1px 8px rgba(0,0,0,0.4); }

  .toolbar {
    max-width: 1000px; margin: -18px auto 0; padding: 0 20px; position: relative; z-index: 5;
    display: flex; flex-direction: column; gap: 14px; align-items: center;
  }
  .search-box { max-width: 420px; width: 100%; }
  .search-box input {
    width: 100%; padding: 13px 20px; border-radius: 30px; border: none;
    font-family: inherit; font-size: 15px; outline: none; background: white;
    box-shadow: 0 6px 18px rgba(0,0,0,0.1);
  }
  .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .filter-chip {
    background: white; border: 2px solid #e5e0d5; border-radius: 30px;
    padding: 9px 18px; font-size: 13.5px; font-weight: 700; color: #6b6558;
    cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.06); transition: all 0.15s;
  }
  .filter-chip:hover { border-color: #bbb; }
  .filter-chip.active { background: #2d2a24; color: white; border-color: #2d2a24; }

  .content-area { max-width: 1000px; margin: 0 auto; padding: 32px 20px 60px; }
  .topic-group { margin-bottom: 36px; }
  .topic-group-title {
    font-size: 17px; font-weight: 700; color: #4a4538; margin-bottom: 14px;
    display: flex; align-items: center; gap: 12px;
  }
  .topic-group-title .count {
    color: white; font-size: 12.5px; padding: 3px 12px; border-radius: 20px; font-weight: 700;
  }
  .topic-group-title .line { flex: 1; height: 2px; background: #e5e0d5; border-radius: 2px; }

  .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
  .exercise-card {
    background: white; border-radius: 22px; overflow: hidden;
    border: 2px solid var(--card-border, #eee); box-shadow: 0 4px 14px rgba(0,0,0,0.06);
    display: flex; flex-direction: column;
  }
  .card-banner {
    height: 110px; background: var(--card-bg, #f0f0f0); overflow: hidden; position: relative;
  }
  .card-banner img { width: 100%; height: 100%; object-fit: cover; object-position: center 18%; }
  .card-season-tag {
    position: absolute; bottom: 8px; left: 10px; background: rgba(255,255,255,0.9);
    color: var(--card-primary, #333); font-size: 11px; font-weight: 700;
    padding: 3px 10px; border-radius: 12px;
  }

  .card-body { padding: 14px 16px 16px; flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .card-title { font-size: 15px; font-weight: 700; color: var(--card-primary, #333); line-height: 1.3; }
  .card-topic-name { font-size: 12px; color: #999; font-weight: 600; margin-bottom: 8px; }

  .card-actions-grid { margin-top: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .card-btn {
    border: none; border-radius: 10px; padding: 8px 6px; font-family: inherit;
    font-weight: 700; font-size: 11.5px; cursor: pointer; display: flex; align-items: center;
    justify-content: center; gap: 4px; transition: all 0.15s; text-decoration: none;
  }
  .card-btn-open { background: var(--card-primary, #333); color: white; }
  .card-btn-open:hover { filter: brightness(1.1); }
  .card-btn-copy { background: #f3f1ea; color: #4a4538; border: 2px solid #e5e0d5; }
  .card-btn-copy:hover { border-color: #bbb; }
  .card-btn-copy.copied { background: #2e9b5f; color: white; border-color: #2e9b5f; }

  .empty-state, .loading-state { text-align: center; padding: 60px 20px; color: #999; font-size: 15px; }
  .empty-state .emoji { font-size: 46px; margin-bottom: 12px; }

  #toast {
    visibility: hidden; min-width: 260px; max-width: 90vw; background: #2d2a24; color: white;
    text-align: center; border-radius: 14px; padding: 14px 22px; position: fixed; z-index: 999;
    left: 50%; bottom: 30px; transform: translateX(-50%); font-size: 14.5px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3); opacity: 0; transition: opacity 0.3s, bottom 0.3s;
  }
  #toast.show { visibility: visible; opacity: 1; bottom: 50px; }

  @media (max-width: 600px) {
    .banner-cover { height: 220px; }
    .banner-overlay h1 { font-size: 21px; }
  }
</style>
</head>
<body>

  <div id="toast"></div>

  <div class="banner-cover">
    <img src="assets/4-seasons-banner.jpg" alt="4 Nàng Tiên 4 Mùa">
    <div class="banner-overlay">
      <h1>📚 Kho Bài Tập IELTS Reading</h1>
      <p>Chọn 1 bài để giao cho học sinh, hoặc copy link gửi trực tiếp</p>
    </div>
  </div>

  <div class="toolbar">
    <div class="search-box">
      <input type="text" id="search-input" placeholder="🔍 Tìm theo tên bài hoặc chủ đề...">
    </div>
    <div class="filter-bar" id="filterBar"></div>
  </div>

  <div class="content-area" id="contentArea">
    <div class="loading-state">Đang tải danh sách bài tập...</div>
  </div>

  <script src="ielts-theme-config.js"></script>
  <script>
    let allExercises = []; // { id, exerciseName, topic, season }
    let activeFilter = "all";

    const contentEl = document.getElementById("contentArea");
    const toastEl = document.getElementById("toast");

    function showToast(msg) {
      toastEl.innerHTML = msg;
      toastEl.classList.add("show");
      setTimeout(() => toastEl.classList.remove("show"), 2500);
    }

    // Tải manifest (chỉ là mảng id) rồi đọc trực tiếp topic/season/exerciseName
    // từ chính file JSON của từng bài — không lưu trùng lặp trong manifest.
    async function loadAllExercises() {
      let ids = [];
      try {
        const manifestRes = await fetch("exercises-manifest.json");
        ids = await manifestRes.json();
      } catch (err) {
        console.error("Không tải được exercises-manifest.json:", err);
        return [];
      }

      const results = await Promise.all(ids.map(async (id) => {
        try {
          const res = await fetch(`exercises/${id}.json`);
          if (!res.ok) throw new Error("HTTP " + res.status);
          const data = await res.json();
          return {
            id: data.id || id,
            exerciseName: data.exerciseName,
            topic: data.topic || "Khác",
            season: data.season || "spring",
          };
        } catch (err) {
          console.warn("⚠️ Bỏ qua bài lỗi:", id, err);
          return null;
        }
      }));

      return results.filter(Boolean);
    }

    function buildExerciseUrl(id, mode) {
      const base = window.location.href.replace(/kho-bai-tap-ielts\.html.*$/, "");
      return base + "bai-tap-ielts.html?id=" + encodeURIComponent(id) + "&mode=" + mode;
    }

    function copyLink(id, mode, btn) {
      const url = buildExerciseUrl(id, mode);
      navigator.clipboard.writeText(url).then(() => {
        const oldHTML = btn.innerHTML;
        btn.innerHTML = "✅ Đã copy!";
        btn.classList.add("copied");
        showToast(mode === "scaffold" ? "🔗 Đã copy link bản CÓ SCAFFOLD!" : "🔗 Đã copy link bản GỐC (không scaffold)!");
        setTimeout(() => { btn.innerHTML = oldHTML; btn.classList.remove("copied"); }, 1800);
      }).catch(() => {
        showToast("⚠️ Không thể tự động copy. Link bài: " + url);
      });
    }
    window.copyLink = copyLink;

    function renderFilterBar() {
      const topicsPresent = [...new Set(allExercises.map(e => e.topic))].sort();
      const bar = document.getElementById("filterBar");
      const chips = [{ key: "all", label: "Tất cả" }].concat(
        topicsPresent.map(t => ({ key: t, label: t }))
      );
      bar.innerHTML = chips.map(c => `
        <div class="filter-chip ${c.key === activeFilter ? "active" : ""}" data-filter="${c.key}">${c.label}</div>
      `).join("");
      bar.querySelectorAll(".filter-chip").forEach(chip => {
        chip.addEventListener("click", () => {
          activeFilter = chip.getAttribute("data-filter");
          renderFilterBar();
          renderContent();
        });
      });
    }

    function renderCard(ex) {
      const theme = getSeasonTheme(ex.season);
      const primary = theme.primary;
      const bg = theme.bgMain;
      const border = theme.borderColor;

      return `
        <div class="exercise-card" style="--card-primary:${primary}; --card-bg:${bg}; --card-border:${border};">
          <div class="card-banner">
            <img src="${theme.avatarImg}" alt="${theme.fairyName}">
            <span class="card-season-tag">${theme.fairyName}</span>
          </div>
          <div class="card-body">
            <div class="card-title">${ex.exerciseName}</div>
            <div class="card-topic-name">${ex.topic}</div>
            <div class="card-actions-grid">
              <a class="card-btn card-btn-open" href="bai-tap-ielts.html?id=${ex.id}&mode=scaffold" target="_blank" rel="noopener">▶️ Scaffold</a>
              <a class="card-btn card-btn-open" href="bai-tap-ielts.html?id=${ex.id}&mode=direct" target="_blank" rel="noopener">▶️ Bài Gốc</a>
              <button class="card-btn card-btn-copy" onclick="copyLink('${ex.id}', 'scaffold', this)">🔗 Copy Scaffold</button>
              <button class="card-btn card-btn-copy" onclick="copyLink('${ex.id}', 'direct', this)">🔗 Copy Bài Gốc</button>
            </div>
          </div>
        </div>
      `;
    }

    function renderContent() {
      const query = document.getElementById("search-input").value.trim().toLowerCase();

      let filtered = allExercises.filter(ex =>
        ex.exerciseName.toLowerCase().includes(query) ||
        ex.topic.toLowerCase().includes(query) ||
        ex.id.toLowerCase().includes(query)
      );

      if (activeFilter !== "all") {
        filtered = filtered.filter(ex => ex.topic === activeFilter);
      }

      if (filtered.length === 0) {
        const msg = allExercises.length === 0
          ? "Kho dữ liệu đang trống. Hãy thêm file bài tập vào thư mục <b>exercises/</b> và khai báo trong <b>exercises-manifest.json</b>."
          : "Không tìm thấy bài tập phù hợp.";
        contentEl.innerHTML = `<div class="empty-state"><div class="emoji">📭</div>${msg}</div>`;
        return;
      }

      // Gom nhóm theo Topic
      const groups = {};
      filtered.forEach(ex => {
        if (!groups[ex.topic]) groups[ex.topic] = [];
        groups[ex.topic].push(ex);
      });

      const topicOrder = Object.keys(groups).sort();

      contentEl.innerHTML = topicOrder.map(topic => {
        // Dùng màu của theme mùa xuất hiện nhiều nhất trong nhóm để tô màu badge số lượng
        const firstTheme = getSeasonTheme(groups[topic][0].season);
        return `
          <div class="topic-group">
            <div class="topic-group-title">
              ${topic}
              <span class="count" style="background:${firstTheme.primary};">${groups[topic].length} bài</span>
              <span class="line"></span>
            </div>
            <div class="card-grid">
              ${groups[topic].map(ex => renderCard(ex)).join("")}
            </div>
          </div>
        `;
      }).join("");
    }

    async function init() {
      allExercises = await loadAllExercises();
      renderFilterBar();
      document.getElementById("search-input").addEventListener("input", renderContent);
      renderContent();
    }

    window.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
